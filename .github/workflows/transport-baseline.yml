name: Transport baseline regression

on:
  pull_request:
    paths:
      - "scripts/run_transport_baseline.py"
      - "src/anonlab/local_benchmark.py"
      - "tests/test_transport_baseline_runner.py"
      - ".github/workflows/transport-baseline.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "perf/reproducible-baseline-plan"
    paths:
      - "scripts/run_transport_baseline.py"
      - "src/anonlab/local_benchmark.py"
      - "tests/test_transport_baseline_runner.py"
      - ".github/workflows/transport-baseline.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loopback-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run baseline runner regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_transport_baseline_runner.py

      - name: Capture a smoke-sized loopback artifact
        run: |
          python scripts/run_transport_baseline.py \
            --hops 1 \
            --bytes 65536 \
            --trials 2 \
            --latency-samples 10 \
            --timeout 60 \
            --output "$RUNNER_TEMP/aegis-transport-smoke.json"

      - name: Upload raw smoke artifact
        if: always() && hashFiles('/tmp/aegis-transport-smoke.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transport-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aegis-transport-smoke.json
          if-no-files-found: ignore
          retention-days: 30
