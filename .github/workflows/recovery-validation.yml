name: Recovery archive validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  recovered-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify archive checksum and nested ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "ae59e83cf68caebdebeb7522dd36c0bc16f9bbe288bbff1ce99bd7880c659be3  AEGIS-consolidated-recovery-2026-10-09.zip" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import io
          outer = Path("AEGIS-consolidated-recovery-2026-10-09.zip")
          with ZipFile(outer) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt outer ZIP member: {bad}")
              nested = [name for name in archive.namelist() if name.lower().endswith(".zip")]
              if len(nested) != 8:
                  raise SystemExit(f"Expected 8 nested research ZIPs, found {len(nested)}")
              for name in nested:
                  with ZipFile(io.BytesIO(archive.read(name))) as inner:
                      bad = inner.testzip()
                      if bad:
                          raise SystemExit(f"Corrupt nested member {name}: {bad}")
              print(f"Validated outer ZIP and {len(nested)} nested ZIP archives")
          PY

      - name: Extract complete recovered v0.27.4 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import io
          outer = Path("AEGIS-consolidated-recovery-2026-10-09.zip")
          destination = Path("recovered-source")
          destination.mkdir()
          target_name = "AEGIS-v0.27.4-four-server-fault-detection-research.zip"
          with ZipFile(outer) as archive:
              matches = [n for n in archive.namelist() if n.endswith(target_name)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {target_name}, found {len(matches)}")
              with ZipFile(io.BytesIO(archive.read(matches[0]))) as snapshot:
                  bad = snapshot.testzip()
                  if bad:
                      raise SystemExit(f"Corrupt source snapshot member: {bad}")
                  snapshot.extractall(destination)
          roots = [p.parent for p in destination.rglob("pyproject.toml")
                   if (p.parent / "src" / "anonlab").is_dir() and (p.parent / "tests").is_dir()]
          if len(roots) != 1:
              raise SystemExit(f"Expected one complete source root, found {len(roots)}")
          root = roots[0]
          modules = list((root / "src" / "anonlab").glob("*.py"))
          tests = list((root / "tests").glob("test_*.py"))
          if len(modules) != 42 or len(tests) != 25:
              raise SystemExit(f"Unexpected source inventory: {len(modules)} modules, {len(tests)} test files")
          print(f"Recovered {len(modules)} modules and {len(tests)} test files from {root}")

          # Security hardening overlay: do not silently permit unverified PIR over remote hosts.
          pir_path = root / "src" / "anonlab" / "pir_rpc.py"
          source = pir_path.read_text(encoding="utf-8")
          old_sig = """    timeout_seconds: float = 5.0,
    expected_snapshot_sha256: str | None = None,
) -> PirRpcTransfer:
    \"\"\"Retrieve one record from two distinct authenticated RPC endpoints.

    The selected index is used only to form client-side query masks and is never
    present in an RPC request. Use TLS endpoints for remote hosts; HMAC-only mode
    is retained only for local research compatibility.
    \"\"\""""
          new_sig = """    timeout_seconds: float = 5.0,
    expected_snapshot_sha256: str | None = None,
    allow_unverified_remote: bool = False,
) -> PirRpcTransfer:
    \"\"\"Retrieve one record from two distinct authenticated RPC endpoints.

    The selected index is used only to form client-side query masks and is never
    present in an RPC request. TLS authenticates the server and protects transport;
    it does not prove correct PIR computation. Remote retrieval is fail-closed
    unless a caller explicitly opts into this unverified research mode. Opting in
    does not make the protocol secure.
    \"\"\""""
          if old_sig not in source:
              raise SystemExit("PIR hardening patch could not find the expected two-server signature")
          source = source.replace(old_sig, new_sig, 1)
          old_validation = """    if not isinstance(item_count, int) or isinstance(item_count, bool) or not 1 <= item_count <= MAX_RECORDS:
        raise ValueError(f"item_count must be within 1..{MAX_RECORDS}")"""
          new_validation = """    if not isinstance(allow_unverified_remote, bool):
        raise ValueError("allow_unverified_remote must be a bool")
    if not isinstance(item_count, int) or isinstance(item_count, bool) or not 1 <= item_count <= MAX_RECORDS:
        raise ValueError(f"item_count must be within 1..{MAX_RECORDS}")"""
          if old_validation not in source:
              raise SystemExit("PIR hardening patch could not find item_count validation")
          source = source.replace(old_validation, new_validation, 1)
          old_endpoints = """    a, b = endpoints
    if a.server_id == b.server_id:"""
          new_endpoints = """    a, b = endpoints
    if any(not ipaddress.ip_address(endpoint.host).is_loopback for endpoint in endpoints) and not allow_unverified_remote:
        raise PirRpcProtocolError(
            "remote PIR computation is not cryptographically verifiable; "
            "remote research mode requires allow_unverified_remote=True and must not be used for sensitive data"
        )
    if a.server_id == b.server_id:"""
          if old_endpoints not in source:
              raise SystemExit("PIR hardening patch could not find endpoint validation")
          source = source.replace(old_endpoints, new_endpoints, 1)
          old_four_sig = """    timeout_seconds: float = 5.0,
    expected_snapshot_sha256: str | None = None,
) -> RedundantPirRpcTransfer:"""
          new_four_sig = """    timeout_seconds: float = 5.0,
    expected_snapshot_sha256: str | None = None,
    allow_unverified_remote: bool = False,
) -> RedundantPirRpcTransfer:"""
          if old_four_sig not in source:
              raise SystemExit("PIR hardening patch could not find the four-server signature")
          source = source.replace(old_four_sig, new_four_sig, 1)
          old_first_call = """            expected_snapshot_sha256=expected_snapshot_sha256,
        ),
        retrieve_two_server_pir_rpc("""
          new_first_call = """            expected_snapshot_sha256=expected_snapshot_sha256,
            allow_unverified_remote=allow_unverified_remote,
        ),
        retrieve_two_server_pir_rpc("""
          if old_first_call not in source:
              raise SystemExit("PIR hardening patch could not find first four-server call")
          source = source.replace(old_first_call, new_first_call, 1)
          old_second_call = """            expected_snapshot_sha256=expected_snapshot_sha256,
        ),
    )
    if not hmac.compare_digest(first.snapshot_sha256, second.snapshot_sha256):"""
          new_second_call = """            expected_snapshot_sha256=expected_snapshot_sha256,
            allow_unverified_remote=allow_unverified_remote,
        ),
    )
    if not hmac.compare_digest(first.snapshot_sha256, second.snapshot_sha256):"""
          if old_second_call not in source:
              raise SystemExit("PIR hardening patch could not find second four-server call")
          source = source.replace(old_second_call, new_second_call, 1)
          pir_path.write_text(source, encoding="utf-8")

          # Regression tests use documentation-only IP ranges; they fail before network I/O.
          guard_test = root / "tests" / "test_pir_remote_fail_closed.py"
          guard_test.write_text('''from __future__ import annotations

import ssl
import unittest

from anonlab.pir_rpc import PirRpcEndpoint, PirRpcProtocolError, retrieve_two_server_pir_rpc, retrieve_four_server_pir_rpc_checked


class RemotePirFailClosedTests(unittest.IsolatedAsyncioTestCase):
    def setUp(self):
        context = ssl.create_default_context()
        context.minimum_version = ssl.TLSVersion.TLSv1_2
        self.endpoints = tuple(
            PirRpcEndpoint(f"remote-{i}", host, 443, ssl_context=context, server_hostname="pir.example.invalid")
            for i, host in enumerate(("192.0.2.1", "192.0.2.2", "192.0.2.3", "192.0.2.4"))
        )

    async def test_two_server_remote_pir_is_rejected_by_default_before_network_io(self):
        with self.assertRaisesRegex(PirRpcProtocolError, "not cryptographically verifiable"):
            await retrieve_two_server_pir_rpc(self.endpoints[:2], 8, 3, record_bytes=16)

    async def test_four_server_remote_pir_is_rejected_by_default_before_network_io(self):
        with self.assertRaisesRegex(PirRpcProtocolError, "not cryptographically verifiable"):
            await retrieve_four_server_pir_rpc_checked(self.endpoints, 8, 3, record_bytes=16)

    async def test_remote_research_mode_must_be_explicitly_boolean(self):
        with self.assertRaisesRegex(ValueError, "must be a bool"):
            await retrieve_two_server_pir_rpc(self.endpoints[:2], 8, 3, record_bytes=16, allow_unverified_remote=1)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          Path("recovered-source-root.txt").write_text(str(root), encoding="utf-8")
          PY

      - name: Compile recovered source and tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat recovered-source-root.txt)"
          python -m compileall -q "$ROOT/src" "$ROOT/tests"

      - name: Install the recovered package and validate dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          ROOT="$(cat recovered-source-root.txt)"
          cd "$ROOT"
          python -m pip install -e ".[onion-lab]" pytest
          python -m pip check

      - name: Validate every declared console entry point
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat "$GITHUB_WORKSPACE/recovered-source-root.txt")"
          cd "$ROOT"
          python - <<'PY'
          from importlib.metadata import entry_points
          from importlib.util import find_spec
          eps = entry_points(group="console_scripts")
          project_eps = {ep.name: ep for ep in eps if ep.name.startswith(("aegis", "rea-anon"))}
          if len(project_eps) < 35:
              raise SystemExit(f"Expected at least 35 AEGIS/REA console scripts, found {len(project_eps)}")
          failures = []
          for name, ep in sorted(project_eps.items()):
              module = ep.value.split(":", 1)[0]
              if find_spec(module) is None:
                  failures.append(f"{name} -> missing module {module}")
              if not __import__("shutil").which(name):
                  failures.append(f"{name} -> executable not installed")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {len(project_eps)} installed console entry points")
          PY
          aegis --help >/dev/null

      - name: Run recovered test suite
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat recovered-source-root.txt)"
          cd "$ROOT"
          python -m pytest -q

      - name: Validate the checked-out Git source tree on source-sync PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/anonlab -maxdepth 1 -name '*.py' -type f | wc -l)" -eq 42
          test "$(find tests -maxdepth 1 -name 'test_*.py' -type f | wc -l)" -eq 26
          python -m pip install -e ".[onion-lab]" pytest
          python -m pip check
          python -m compileall -q src tests
          python -m pytest -q

      - name: Prepare missing recovered source and test files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat recovered-source-root.txt)"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          root = Path(sys.argv[1])
          workspace = Path.cwd()
          copied = []
          for source_base, target_base, pattern in (
              (root / "src" / "anonlab", workspace / "src" / "anonlab", "*.py"),
              (root / "tests", workspace / "tests", "test_*.py"),
          ):
              for source in sorted(source_base.glob(pattern)):
                  target = target_base / source.name
                  if not target.exists():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, target)
                      copied.append(target.relative_to(workspace).as_posix())
          print(f"Prepared {len(copied)} missing files for review")
          for path in copied:
              print(path)
          if not copied:
              print("Git source tree already contains all recovered Python modules and tests.")
          PY

      - name: Validate the completed checkout before publishing the PR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/anonlab -maxdepth 1 -name '*.py' -type f | wc -l)" -eq 42
          test "$(find tests -maxdepth 1 -name 'test_*.py' -type f | wc -l)" -eq 25
          python -m pip install -e ".[onion-lab]" pytest
          python -m pip check
          python -m compileall -q src tests
          python -m pytest -q

      - name: Open PR for missing recovered source files
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/recovered-source-completion
          delete-branch: true
          commit-message: "recovery: publish missing source modules and tests"
          title: "Recovery: publish all recovered source modules and tests"
          body: |
            This PR adds recovered Python modules and tests that were present in the verified v0.27.4 source snapshot but missing as individual Git files.

            - Adds only files absent from the current tree; existing files are not overwritten.
            - The archive validation workflow verified the embedded snapshot checksum and ZIP integrity.
            - The PR workflow must install the checkout itself, validate console entry points, compile the source, and pass the full test suite before merge.
            - This does not resolve the separately tracked cryptographic PIR-verifiability research blocker.
          add-paths: |
            src/anonlab/*.py
            tests/test_*.py
