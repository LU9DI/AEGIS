name: Recovery archive validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  recovered-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify archive checksum and nested ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "ae59e83cf68caebdebeb7522dd36c0bc16f9bbe288bbff1ce99bd7880c659be3  AEGIS-consolidated-recovery-2026-10-09.zip" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import io
          outer = Path("AEGIS-consolidated-recovery-2026-10-09.zip")
          with ZipFile(outer) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt outer ZIP member: {bad}")
              nested = [name for name in archive.namelist() if name.lower().endswith(".zip")]
              if len(nested) != 8:
                  raise SystemExit(f"Expected 8 nested research ZIPs, found {len(nested)}")
              for name in nested:
                  with ZipFile(io.BytesIO(archive.read(name))) as inner:
                      bad = inner.testzip()
                      if bad:
                          raise SystemExit(f"Corrupt nested member {name}: {bad}")
              print(f"Validated outer ZIP and {len(nested)} nested ZIP archives")
          PY

      - name: Extract complete recovered v0.27.4 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import io
          outer = Path("AEGIS-consolidated-recovery-2026-10-09.zip")
          destination = Path("recovered-source")
          destination.mkdir(exist_ok=True)
          target_name = "AEGIS-v0.27.4-four-server-fault-detection-research.zip"
          with ZipFile(outer) as archive:
              matches = [n for n in archive.namelist() if n.endswith(target_name)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {target_name}, found {len(matches)}")
              with ZipFile(io.BytesIO(archive.read(matches[0]))) as snapshot:
                  bad = snapshot.testzip()
                  if bad:
                      raise SystemExit(f"Corrupt source snapshot member: {bad}")
                  snapshot.extractall(destination)
          roots = [p.parent for p in destination.rglob("pyproject.toml")
                   if (p.parent / "src" / "anonlab").is_dir() and (p.parent / "tests").is_dir()]
          if len(roots) != 1:
              raise SystemExit(f"Expected one complete source root, found {len(roots)}")
          root = roots[0]
          modules = list((root / "src" / "anonlab").glob("*.py"))
          tests = list((root / "tests").glob("test_*.py"))
          if len(modules) != 42 or len(tests) != 25:
              raise SystemExit(f"Unexpected archived source inventory: {len(modules)} modules, {len(tests)} test files")
          print(f"Recovered {len(modules)} modules and {len(tests)} archived test files from {root}")
          Path("recovered-source-root.txt").write_text(str(root), encoding="utf-8")
          PY

      - name: Apply remote PIR fail-closed safety overlay
        shell: bash
        run: |
          set -euo pipefail
          python recovery/apply_remote_pir_guard.py "$(cat recovered-source-root.txt)"

      - name: Compile recovered source and tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat recovered-source-root.txt)"
          python -m compileall -q "$ROOT/src" "$ROOT/tests"

      - name: Install the recovered package and validate dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          ROOT="$(cat recovered-source-root.txt)"
          cd "$ROOT"
          python -m pip install -e ".[onion-lab]" pytest
          python -m pip check

      - name: Validate every declared console entry point
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat "$GITHUB_WORKSPACE/recovered-source-root.txt")"
          cd "$ROOT"
          python - <<'PY'
          from importlib.metadata import entry_points
          from importlib.util import find_spec
          eps = entry_points(group="console_scripts")
          project_eps = {ep.name: ep for ep in eps if ep.name.startswith(("aegis", "rea-anon"))}
          if len(project_eps) < 35:
              raise SystemExit(f"Expected at least 35 AEGIS/REA console scripts, found {len(project_eps)}")
          failures = []
          for name, ep in sorted(project_eps.items()):
              module = ep.value.split(":", 1)[0]
              if find_spec(module) is None:
                  failures.append(f"{name} -> missing module {module}")
              if not __import__("shutil").which(name):
                  failures.append(f"{name} -> executable not installed")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {len(project_eps)} installed console entry points")
          PY
          aegis --help >/dev/null

      - name: Run recovered test suite
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat recovered-source-root.txt)"
          cd "$ROOT"
          python -m pytest -q

      - name: Validate the checked-out Git source tree on source-sync PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/anonlab -maxdepth 1 -name '*.py' -type f | wc -l)" -eq 42
          test "$(find tests -maxdepth 1 -name 'test_*.py' -type f | wc -l)" -ge 26
          python -m pip install -e ".[onion-lab]" pytest
          python -m pip check
          python -m compileall -q src tests
          python -m pytest -q

      - name: Prepare missing recovered source, tests, docs, and research artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat recovered-source-root.txt)"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          root = Path(sys.argv[1])
          workspace = Path.cwd()
          excluded = {Path("README.md"), Path("pyproject.toml"), Path(".gitignore")}
          copied = []
          conflicts = []
          for source in sorted(root.rglob("*")):
              if not source.is_file():
                  continue
              relative = source.relative_to(root)
              if relative in excluded or any(part.startswith(".") for part in relative.parts):
                  continue
              target = workspace / relative
              if target.exists():
                  if target.read_bytes() != source.read_bytes():
                      conflicts.append(relative.as_posix())
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied.append(relative.as_posix())
          print(f"Prepared {len(copied)} missing snapshot files; preserved {len(conflicts)} existing files with different content.")
          print("Existing differences are not overwritten:")
          for path in conflicts:
              print(f"DIFF {path}")
          print("Added files:")
          for path in copied:
              print(path)
          PY

      - name: Validate the completed checkout before publishing the PR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/anonlab -maxdepth 1 -name '*.py' -type f | wc -l)" -eq 42
          test "$(find tests -maxdepth 1 -name 'test_*.py' -type f | wc -l)" -ge 26
          python -m pip install -e ".[onion-lab]" pytest
          python -m pip check
          python -m compileall -q src tests
          python -m pytest -q

      - name: Remove temporary extraction before staging recovery artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered-source recovered-source-root.txt

      - name: Open PR for missing recovered source files
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/recovered-artifact-completion-v3
          delete-branch: true
          commit-message: "recovery: publish remaining snapshot artifacts"
          title: "Recovery: publish remaining recovered source and research artifacts"
          body: |
            This PR adds missing files from the verified v0.27.4 source snapshot, including code, tests, docs, examples, experiment artifacts, reports, and changelog.

            - Adds only files absent from the current tree; existing files are not overwritten.
            - The archive validation workflow verified the embedded snapshot checksum and ZIP integrity.
            - The PR workflow must install the checkout itself, validate console entry points, compile the source, and pass the full test suite before merge.
            - This does not resolve the separately tracked cryptographic PIR-verifiability research blocker.
